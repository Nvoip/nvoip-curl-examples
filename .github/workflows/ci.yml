name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  request-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests
      - run: for script in lib/*.sh examples/*.sh; do sh -n "$script"; done
